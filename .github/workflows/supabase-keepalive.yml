name: Supabase keep-alive

# El plan gratuito de Supabase pausa el proyecto automáticamente después de
# ~7 días sin actividad en la API. Este workflow hace un pedido liviano de
# lectura cada pocos días para que nunca llegue a esos 7 días y la app no se
# quede sin base de datos.
on:
  schedule:
    - cron: "0 9 * * 1,4" # lunes y jueves 9:00 UTC — nunca pasan más de ~4 días sin actividad
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl --fail --silent --show-error \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/"
        env:
          SUPABASE_URL: "https://zlukrktpjffiycarpduc.supabase.co"
          SUPABASE_ANON_KEY: "sb_publishable_QFLNZihxZRqdvyc-GSRZPw_Q-rkA6No"
