name: Compilar APK Android (SSOMA Adecco)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "index.html"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci

      # Copia la app web más reciente (raíz del repo) a mobile/www antes de empaquetar,
      # así el APK siempre lleva el index.html actualizado sin duplicar el archivo a mano.
      - name: Sincronizar app web con Capacitor
        run: |
          cp ../index.html www/index.html
          cp ../manifest.json www/manifest.json
          cp -r ../icons www/icons
          npx cap sync android

      # Firebase (google-services.json) es opcional: si el secreto no está configurado
      # todavía, el APK se compila igual pero sin notificaciones push funcionales.
      - name: Configurar Firebase (si está disponible)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        if: env.GOOGLE_SERVICES_JSON_BASE64 != ''
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Compilar APK (debug)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ssoma-adecco-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
