name: Compilar APK Android (SSOMA Adecco)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "index.html"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # El runner ubuntu-latest de GitHub Actions ya trae el Android SDK preinstalado
      # (ANDROID_HOME/cmdline-tools/platform-tools). Antes se usaba android-actions/setup-android@v3
      # acá, pero esa acción intenta instalar el paquete "tools" (Android SDK Tools clásico),
      # que Google retiró del repositorio del SDK hace años — el sdkmanager ya no lo encuentra
      # y el paso falla siempre con "Failed to find package 'tools'". Al no ser necesario
      # (el SDK del runner ya alcanza para compilar), se quita el paso en vez de intentar
      # forzar la instalación de un paquete descontinuado.

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm ci

      # Copia la app web más reciente (raíz del repo) a mobile/www antes de empaquetar,
      # así el APK siempre lleva el index.html actualizado sin duplicar el archivo a mano.
      - name: Sincronizar app web con Capacitor
        run: |
          cp ../index.html www/index.html
          cp ../manifest.json www/manifest.json
          cp -r ../icons www/icons
          npx cap sync android

      - name: Compilar APK (debug)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ssoma-adecco-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
